name: Деплой воркера

on:
  push:
    paths: ['server/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # exit 0 внутри шага НЕ прерывает job (он и так продолжится дальше) —
      # поэтому гейт секретов сделан через output шага, а не через ранний
      # выход. Секретов нет → deploy=no, и все шаги ниже пропускают себя сами
      # через `if:`. Job при пустых секретах остаётся зелёным (докладка
      # секретов — руками Влада, см. docs/SYNC-SETUP.md).
      - name: Проверка секретов Cloudflare
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::notice::Секреты Cloudflare не заданы — деплой пропущен (см. docs/SYNC-SETUP.md)"
            echo "deploy=no" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.deploy == 'yes'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        if: steps.gate.outputs.deploy == 'yes'

      # Идемпотентно: если база уже создана прошлым запуском workflow, команда
      # падает с «already exists» — || true проглатывает именно этот случай.
      # Реальные сбои (например, неверный токен) ловятся на следующих шагах,
      # где wrangler уже требует существующую и доступную базу.
      - name: Создать D1 (если ещё нет)
        if: steps.gate.outputs.deploy == 'yes'
        run: npx wrangler d1 create ai-platform-sync || true

      # wrangler.toml лежит в репозитории и не может заранее знать uuid базы —
      # database_id там плейсхолдер TO_BE_CREATED. Вычитываем реальный id
      # (в JSON-выводе d1 list он в поле `uuid`) и подставляем перед миграциями
      # и деплоем, которым нужен рабочий биндинг DB.
      - name: Подставить database_id в wrangler.toml
        if: steps.gate.outputs.deploy == 'yes'
        run: |
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="ai-platform-sync") | .uuid')
          if [ -z "$DB_ID" ]; then
            echo "::error::Не нашли database_id ai-platform-sync в выводе wrangler d1 list"
            exit 1
          fi
          sed -i "s/TO_BE_CREATED/$DB_ID/" wrangler.toml

      - name: Применить миграции
        if: steps.gate.outputs.deploy == 'yes'
        run: npx wrangler d1 migrations apply ai-platform-sync --remote

      # Секрет SERPER_KEY этот workflow не трогает — Влад кладёт его сам
      # (`npx wrangler secret put SERPER_KEY` или в дашборде Cloudflare), см.
      # docs/SYNC-SETUP.md. Без него /search штатно отвечает 501 —
      # это рабочее состояние, а не ошибка деплоя.
      - name: Деплой
        if: steps.gate.outputs.deploy == 'yes'
        run: npx wrangler deploy

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1917" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black, НЕ black-translucent: при translucent iOS в standalone сдвигает
         вьюпорт для position:fixed вверх на высоту статус-бара, и каркас
         fixed inset-0 не достаёт до низа экрана — под композером появляется
         полоса. С black контент-область считается корректно. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AI" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>AI Platform</title>
    <!-- Тема живёт в IndexedDB, а его API асинхронный: до первого рендера
         React прочитать её нельзя, и у светлого пользователя первый кадр
         всегда был тёмным. Выбор зеркалится в localStorage (ThemeApplier),
         отсюда читается синхронно — вспышки нет. -->
    <script>
      (function () {
        try {
          var pick = localStorage.getItem('cc-theme') || 'dark';
          var light =
            pick === 'light' ||
            (pick === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) {
            document.documentElement.classList.add('light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#faf9f5');
            // В standalone iOS читает эту мету только при холодном старте,
            // поэтому правим здесь, а не в React.
            var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
            if (bar) bar.setAttribute('content', 'default');
          }
        } catch (e) {
          /* приватный режим без localStorage — остаёмся на тёмной */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
